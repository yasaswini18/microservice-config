spring.application.name=apiGateway

server.port=8080

#registers the gateway with eureka.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

#Route 1 UserService
spring.cloud.gateway.routes[0].id=userService
spring.cloud.gateway.routes[0].uri=lb://userService
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**
#lb-load balancing
#every endpoint that comes after /users/ should be accepted

#Route 2 Doctor Service
spring.cloud.gateway.routes[1].id=doctorService
spring.cloud.gateway.routes[1].uri=lb://doctorService
spring.cloud.gateway.routes[1].predicates[0]=Path=/doctors/**

logging.level.org.springframework.cloud.gateway=DEBUG

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
